<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>マスコット設定</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #252526;
      color: #ccc;
      font-family: 'Segoe UI', 'Yu Gothic UI', Tahoma, sans-serif;
      font-size: 13px;
    }
    body { padding: 16px; }

    .setting-group { margin-bottom: 16px; }
    .setting-label { display: block; margin-bottom: 6px; color: #aaa; }
    .setting-label .val { float: right; color: #777; font-variant-numeric: tabular-nums; }

    select, input[type="range"] {
      width: 100%;
      background: #3c3c3c;
      border: 1px solid #555;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      outline: none;
      font: inherit;
    }
    input[type="range"] { padding: 0; accent-color: #4ea1ff; }
    select:focus { border-color: #4ea1ff; }
    optgroup { color: #888; }
    option { color: #fff; }

    .button-row { display: flex; gap: 6px; }
    .button-row select { flex: 2; }
    .button-row button.narrow { flex: 0 0 34px; font-size: 14px; padding: 3px 0; }
    button {
      flex: 1;
      background: #3c3c3c;
      border: 1px solid #555;
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }
    button:hover { background: #4a4a4a; }
    button:disabled { opacity: 0.4; cursor: default; }

    .check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; }
    .check-row.disabled { opacity: 0.45; cursor: default; }
    .shared { color: #777; font-size: 11px; }
    .character-group { padding-bottom: 12px; }
    .credit { margin-top: 4px; font-size: 11px; color: #888; }
    .hint { font-size: 11px; color: #777; margin-top: 4px; }
    .mt { margin-top: 6px; }
    h2 { font-size: 12px; font-weight: 600; color: #4ea1ff; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
    h2::after { content: ''; flex: 1; height: 1px; background: #3a3a3a; }
    h2.common { color: #aaa; margin-top: 24px; }
    .button-row button.side, .label-row button.side { flex: 0 0 auto; padding: 5px 12px; }
    .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .label-row .setting-label { margin: 0; }

    /* モデル一覧（エクスプローラ風）。列数は窓の幅で変わる */
    .model-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 8px;
      max-height: 330px;
      overflow-y: auto;
      padding: 6px;
      background: #1e1e1e;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
    }
    .model-grid .group { grid-column: 1 / -1; font-size: 11px; color: #777; margin-top: 2px; }
    .model-tile {
      background: none; border: 1px solid transparent; border-radius: 6px;
      padding: 4px; color: #ccc; display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 11px; min-width: 0;
    }
    .model-tile:hover { background: #2d2d2d; }
    .model-tile.selected { border-color: #4ea1ff; background: #264f78; color: #fff; }
    .model-tile .thumb { width: 100%; aspect-ratio: 1; border-radius: 4px; overflow: hidden; background: #333; display: grid; place-items: center; }
    .model-tile .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .model-tile .name {
      width: 100%; text-align: center; line-height: 1.3; word-break: break-all;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* サムネが無いモデルは頭文字 */
    .initial { font-size: 26px; font-weight: 600; color: #888; }
    .mini-thumb { flex: 0 0 34px; height: 34px; border-radius: 4px; overflow: hidden; background: #333; display: grid; place-items: center; }
    .mini-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .mini-thumb .initial { font-size: 15px; }
  </style>
</head>
<body>

  <div class="setting-group character-group">
    <label class="setting-label">キャラ</label>
    <div class="button-row">
      <div id="character-thumb" class="mini-thumb"></div>
      <select id="character-select"></select>
      <button id="btn-add-character" class="narrow" title="キャラを追加">＋</button>
      <button id="btn-remove-character" class="narrow" title="このキャラを消す">−</button>
    </div>
    <div class="hint">ここから下はこのキャラだけの設定（右クリックでも変えられます）。VS Code のイベントと時報は代表（1番）だけ</div>
  </div>

  <h2>見た目</h2>

  <div class="setting-group">
    <div class="label-row">
      <label class="setting-label">モデル</label>
      <button id="btn-import-model" class="side" title="ZIP / .vrm / フォルダをライブラリに入れて、このキャラに使う。同じ名前は上書き。キャラにドロップしても同じ">取り込む…</button>
    </div>
    <div id="model-grid" class="model-grid"></div>
    <div class="button-row mt">
      <button id="btn-select-file" title="取り込まずに、置いてある場所のまま読み込む">ファイルを直接開く…</button>
      <button id="btn-remove-model">ライブラリから削除</button>
    </div>
  </div>

  <div class="setting-group">
    <label class="setting-label">サイズ <span class="val" id="height-val"></span></label>
    <input type="range" id="height-range" min="200" max="1000" step="10">
    <div class="hint">キャラの上で Ctrl＋ホイールでも変更できます</div>
  </div>

  <div class="setting-group">
    <label class="setting-label">不透明度 <span class="val" id="opacity-val"></span></label>
    <input type="range" id="opacity-range" min="0.2" max="1.0" step="0.05">
  </div>

  <div class="setting-group">
    <label class="check-row"><input type="checkbox" id="gaze-check">視線追従</label>
  </div>

  <h2>声</h2>

  <div class="setting-group">
    <label class="setting-label">話し方</label>
    <div class="button-row">
      <select id="voice-mode-select">
        <option value="pack">ボイスパックだけ</option>
        <option value="voicevox">VOICEVOX</option>
        <option value="os">ボイスパック＋OS 音声</option>
        <option value="mute">ミュート（字幕だけ）</option>
      </select>
      <button id="btn-test-tts" class="side">試聴</button>
    </div>
    <div class="hint" id="voice-mode-hint"></div>
    <div id="voicevox-settings" class="mt">
      <select id="speaker-select"></select>
      <label class="setting-label mt">話速 <span class="val" id="speed-val"></span></label>
      <input type="range" id="speed-range" min="0.7" max="1.6" step="0.05">
      <div id="voicevox-credit" class="credit"></div>
    </div>
  </div>

  <div class="setting-group">
    <label class="setting-label">ボイスパック <span class="shared">クリック・ランダムのセリフ集</span></label>
    <div class="button-row">
      <select id="voice-pack-select"></select>
      <button id="btn-test-voice" class="side">試聴</button>
    </div>
  </div>

  <h2>ふるまい</h2>

  <div class="setting-group">
    <label class="check-row"><input type="checkbox" id="events-check">ランダムイベント</label>
    <label class="check-row" id="chime-row"><input type="checkbox" id="chime-check">時報<span class="shared" id="chime-note"></span></label>
    <label class="check-row" id="follow-row"><input type="checkbox" id="follow-check" title="VS Code の窓の中だけで動く">VS Code に追従<span class="shared" id="follow-note"></span></label>
  </div>

  <h2 class="common">全キャラ共通</h2>

  <div class="setting-group">
    <div class="button-row">
      <button id="btn-open-library" title="取り込んだモデルの置き場所">ライブラリを開く</button>
      <button id="btn-open-motions" title="VRM 用のモーション（.vrma）の置き場所。idle で始まる名前は待機、それ以外はしぐさ">モーションを開く</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
