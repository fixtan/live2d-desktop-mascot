<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>マスコット設定</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #252526;
      color: #ccc;
      font-family: 'Segoe UI', 'Yu Gothic UI', Tahoma, sans-serif;
      font-size: 13px;
    }
    body { padding: 16px; }

    .setting-group { margin-bottom: 16px; }
    .setting-label { display: block; margin-bottom: 6px; color: #aaa; }
    .setting-label .val { float: right; color: #777; font-variant-numeric: tabular-nums; }

    select, input[type="range"] {
      width: 100%;
      background: #3c3c3c;
      border: 1px solid #555;
      color: #fff;
      padding: 6px;
      border-radius: 4px;
      outline: none;
      font: inherit;
    }
    input[type="range"] { padding: 0; accent-color: #4ea1ff; }
    select:focus { border-color: #4ea1ff; }
    optgroup { color: #888; }
    option { color: #fff; }

    .button-row { display: flex; gap: 6px; }
    .button-row select { flex: 2; }
    button {
      flex: 1;
      background: #3c3c3c;
      border: 1px solid #555;
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
    }
    button:hover { background: #4a4a4a; }
    button:disabled { opacity: 0.4; cursor: default; }

    .check-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; }
    .credit { margin-top: 4px; font-size: 11px; color: #888; }
    .hint { font-size: 11px; color: #777; margin-top: 4px; }
    .mt { margin-top: 6px; }
  </style>
</head>
<body>

  <div class="setting-group">
    <label class="setting-label">モデル</label>
    <select id="model-select"></select>
    <div class="button-row mt">
      <button id="btn-open-library">ライブラリを開く</button>
      <button id="btn-remove-model">削除</button>
    </div>
    <div class="button-row mt">
      <button id="btn-open-motions" title="VRM 用のモーション（.vrma）。idle で始まる名前は待機、それ以外はしぐさ">モーション（VRMA）フォルダを開く</button>
    </div>
  </div>

  <div class="setting-group">
    <label class="setting-label">ボイスパック</label>
    <div class="button-row">
      <select id="voice-pack-select"></select>
      <button id="btn-test-voice">試聴</button>
    </div>
  </div>

  <div class="setting-group">
    <label class="setting-label">読み上げエンジン（自作セリフ用）</label>
    <div class="button-row">
      <select id="engine-select">
        <option value="voicevox">VOICEVOX</option>
        <option value="os">OS標準</option>
      </select>
      <button id="btn-test-tts">試聴</button>
    </div>
    <div id="voicevox-settings" class="mt">
      <select id="speaker-select"></select>
      <label class="setting-label mt">話速 <span class="val" id="speed-val"></span></label>
      <input type="range" id="speed-range" min="0.7" max="1.6" step="0.05">
      <div id="voicevox-credit" class="credit"></div>
    </div>
  </div>

  <div class="setting-group">
    <label class="setting-label">動作モード</label>
    <select id="mode-select">
      <option value="vscode">VS Code追従モード (枠内限定)</option>
      <option value="free">フリーモード (自由移動)</option>
    </select>
    <div class="hint" id="mode-hint"></div>
  </div>

  <div class="setting-group">
    <label class="setting-label">サイズ <span class="val" id="height-val"></span></label>
    <input type="range" id="height-range" min="200" max="1000" step="10">
    <div class="hint">キャラの上で Ctrl＋ホイールでも変更できます</div>
  </div>

  <div class="setting-group">
    <label class="setting-label">不透明度 <span class="val" id="opacity-val"></span></label>
    <input type="range" id="opacity-range" min="0.2" max="1.0" step="0.05">
  </div>

  <div class="setting-group">
    <label class="check-row"><input type="checkbox" id="gaze-check">視線追従</label>
    <label class="check-row"><input type="checkbox" id="voice-check">自作セリフを読み上げ</label>
    <label class="check-row"><input type="checkbox" id="events-check">ランダムイベント</label>
    <label class="check-row"><input type="checkbox" id="chime-check">時報</label>
  </div>

  <script src="settings.js"></script>
</body>
</html>
